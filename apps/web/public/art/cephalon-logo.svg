<svg xmlns="http://www.w3.org/2000/svg" class="shard-svg" viewBox="60 20 360 260" role="presentation">
          <style>
    /* Chakra Petch — embedded (Google Fonts latin subset, OFL). No network. */
    
    

    :root {
      color-scheme: dark;
      /* palette sampled from the Cephalon app CHROME (panels/text/accents),
         not the hero key art — low saturation, cool charcoal-teal. */
      --bg-0: #091214;
      --bg-1: #0d1a1c;
      --bg-2: #122529;
      --emerald: #74b89a;         /* muted UI accent green */
      --emerald-bright: #93d0b2;  /* highlight / node green */
      --emerald-deep: #3c5f52;
      --emerald-line: #48695c;    /* dim linework */
      --gold: #c3ae82;            /* muted khaki accent (the "394" tone) */
      --gold-bright: #ddc99b;
      --ink: #f1f5f4;
      --sage: #8ba09b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg-0); font-family: "Chakra Petch", "Segoe UI", Arial, sans-serif; }

    .visual {
      position: relative;
      display: grid;
      min-height: 100%;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse 120% 92% at 50% 46%, var(--bg-2) 0%, var(--bg-1) 46%, var(--bg-0) 100%);
    }

    .field, .vignette { position: absolute; inset: 0; }
    .field svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .vignette {
      z-index: 2;
      background: radial-gradient(ellipse at 50% 47%, transparent 22%, var(--bg-0) 82%);
    }

    /* ---- ingest conduits + data packets ------------------------------ */
    .conduit {
      fill: none;
      stroke: var(--emerald-line);
      stroke-width: 1.1;
      stroke-linecap: round;
      opacity: 0.16;
    }

    .mote {
      offset-rotate: 0deg;
      fill: var(--emerald);
      filter: drop-shadow(0 0 3px rgba(116, 184, 154, 0.65));
      animation: ingest linear infinite;
    }
    .mote.priority { fill: var(--gold-bright); filter: drop-shadow(0 0 3px rgba(221, 201, 155, 0.6)); }

    /* ---- the Cephalon construct ------------------------------------------ */
    .shard-stage { position: relative; z-index: 1; width: min(70%, 470px); }
    svg.shard-svg { display: block; width: 100%; height: auto; overflow: visible; }

    .hud       { animation: hud 4s ease-in-out infinite; }
    .breathe   { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    .glitch    { transform-box: fill-box; transform-origin: center; animation: glitch 6s ease-in-out infinite; }
    .core      { transform-box: fill-box; transform-origin: center; animation: spin 12s ease-in-out infinite; }
    .core-lines { filter: drop-shadow(0 0 10px rgba(116, 184, 154, 0.3)); }
    .inner-rot { transform-box: fill-box; transform-origin: center; animation: rot-ccw 20s linear infinite; }
    .inner     { transform-box: fill-box; transform-origin: center; animation: spin-anti 12s ease-in-out infinite; }
    .sheen     { animation: sheen 5s ease-in-out infinite; }
    .node      { animation: node 3s ease-in-out infinite; }
    .ghost     { opacity: 0; animation: ghost 6s ease-in-out infinite; }
    .pulse     { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-out infinite; }

    /* ---- wordmark -------------------------------------------------------- */
    .content {
      position: relative;
      z-index: 3;
      display: grid;
      justify-items: center;
      width: 100%;
      padding: 7% 6%;
    }
    .name {
      margin-top: clamp(6px, 2.4vw, 26px);
      color: var(--ink);
      font-size: clamp(18px, 6.6vw, 62px);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1;
      text-indent: 0.16em;
      text-shadow: 0 0 15px rgba(116, 184, 154, 0.24);
    }
    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: clamp(90px, 34%, 240px);
      margin: clamp(6px, 1.6vw, 14px) 0 clamp(4px, 1vw, 9px);
      color: var(--gold);
    }
    .rule::before, .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to var(--dir, right), transparent, currentColor);
      opacity: 0.55;
    }
    .rule::after { --dir: left; }
    .rule i {
      width: 5px; height: 5px;
      background: currentColor;
      transform: rotate(45deg);
      box-shadow: 0 0 7px rgba(195, 174, 130, 0.5);
    }
    .tagline {
      color: var(--sage);
      font-weight: 600;
      font-size: clamp(6px, 1.55vw, 13px);
      letter-spacing: 0.3em;
      text-align: center;
      text-transform: uppercase;
      text-indent: 0.3em;
      white-space: nowrap;
    }

    @keyframes ingest {
      0%   { offset-distance: 0%;   opacity: 0; }
      14%  { opacity: 0.85; }
      80%  { opacity: 0.85; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes hud      { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.55; } }
    @keyframes rot-ccw  { to { transform: rotate(-360deg); } }
    @keyframes breathe  { 0%, 100% { transform: scale(0.98); } 50% { transform: scale(1.03); } }
    @keyframes spin      { 0%, 100% { transform: scaleX(1); }   50% { transform: scaleX(0.5); } }
    @keyframes spin-anti { 0%, 100% { transform: scaleX(0.5); } 50% { transform: scaleX(1); } }
    @keyframes sheen    { 0%, 100% { opacity: 0.06; } 50% { opacity: 0.22; } }
    @keyframes node     { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes pulse {
      0%   { transform: scale(0.12); opacity: 0.5; }
      70%  { opacity: 0.12; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes glitch {
      0%, 3.5%, 8%, 100% { transform: translate(0, 0); }
      4.5% { transform: translate(2px, -1px); }
      6%   { transform: translate(-2px, 1px); }
    }
    @keyframes ghost {
      0%, 3.5%, 8%, 100% { opacity: 0; transform: translate(0, 0); }
      4.5% { opacity: 0.3;  transform: translate(-3px, 1px); }
      6%   { opacity: 0.14; transform: translate(2px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .mote { offset-distance: 62%; opacity: 0.5; }
      .ghost, .pulse { opacity: 0; }
    }
  .core-lines {stroke-width:4px;} .inner {stroke-width:3px;} .hud {stroke-width:2px;} </style><defs>
            <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="var(--gold-bright)"></stop>
              <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"></stop>
            </linearGradient>
          </defs>

          <!-- HUD corner brackets -->
          <g class="hud" stroke="var(--gold)" stroke-width="1.5" fill="none" opacity="0.4">
            <path d="M70,72 L70,52 L90,52"></path>
            <path d="M390,52 L410,52 L410,72"></path>
            <path d="M70,228 L70,248 L90,248"></path>
            <path d="M390,248 L410,248 L410,228"></path>
          </g>

          <g class="breathe">
            <g class="glitch">
              <!-- outer octahedron -->
              <g class="core">
                <!-- lit facets -->
                <g class="sheen" fill="url(#sheenGrad)">
                  <path d="M240,45 L355,150 L240,182 Z"></path>
                  <path d="M125,150 L240,255 L240,182 Z"></path>
                </g>
                <!-- back edges -->
                <g stroke="var(--emerald-line)" stroke-width="1.3" fill="none" opacity="0.42">
                  <path d="M125,150 L240,118 L355,150"></path>
                  <path d="M240,45 L240,118 L240,255"></path>
                </g>
                <!-- front / silhouette edges -->
                <g class="core-lines" stroke="var(--emerald)" stroke-width="2" fill="none" stroke-linejoin="round">
                  <path d="M240,45 L125,150 L240,255 L355,150 Z"></path>
                  <path d="M125,150 L240,182 L355,150"></path>
                  <path d="M240,45 L240,182 L240,255"></path>
                </g>
                <!-- vertex nodes -->
                <g class="node" fill="var(--emerald-bright)">
                  <circle cx="240" cy="45"  r="2.4"></circle>
                  <circle cx="355" cy="150" r="2.4"></circle>
                  <circle cx="240" cy="255" r="2.4"></circle>
                  <circle cx="125" cy="150" r="2.4"></circle>
                  <circle cx="240" cy="182" r="2"></circle>
                  <circle cx="240" cy="118" r="2"></circle>
                </g>
              </g>

              <!-- inner kernel -->
              <g class="inner-rot">
                <g class="inner" stroke="var(--gold)" stroke-width="1.5" fill="none" opacity="0.78" stroke-linejoin="round">
                  <path d="M240,113 L199,150 L240,187 L281,150 Z"></path>
                  <path d="M199,150 L240,163 L281,150"></path>
                  <path d="M240,113 L240,163 L240,187"></path>
                </g>
              </g>
            </g>

            <!-- chromatic-split ghost (only visible on a glitch beat) -->
            <g class="ghost" stroke="var(--emerald-bright)" stroke-width="2" fill="none" stroke-linejoin="round">
              <path d="M240,45 L125,150 L240,255 L355,150 Z"></path>
              <path d="M240,45 L240,182 L240,255"></path>
            </g>
          </g>

          <!-- process pulse -->
          <circle class="pulse" cx="240" cy="150" r="52" fill="none" stroke="var(--emerald)" stroke-width="1.4"></circle>
        </svg>